<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 7</title>
  
</head>
<body>
    <!-- Internal JavaScript -->
    <script>
        //CÓ thể thêm mã nguồn html vào trong JS
        //Lưu ý: html đặt trong cặp dấu " "
        document.writeln("Hello World!");

        var tenSinhVien = "Nguyễn Văn Tuân";
        var tuoi = 21;
        document.writeln(tenSinhVien + "<br>" + tuoi);
        var  soThuNhat = 10;
        var soThuHai = 5;
        // +_*/
        //% chia lấy phần dư
        var KetQua = soThuNhat % soThuHai;
        document.writeln("Kết quả là" + KetQua);

        //++ --
        document.writeln(++soThuNhat);
        document.writeln(--soThuNhat);

        //+= -= *= /= %=
        //Tương đương: soThuNhat= soThuNhat + soThuHai
        soThuNhat += soThuHai;
        document.writeln(soThuNhat);

        //kiểu dữ liệu
        //string: chuỗi
        //number: số
        //boolean: true/false
        var a = "10";
        var b = "5.5";
        //chuyển string sang number dùng parseInt()
        var tong = parseInt(a) + parseInt(b);
        document.writeln(tong);
        //string
        document.writeln("<br>");
       //Kiểm tra độ dài chuỗi
        document.writeln(tenSinhVien.length);
        //Nối  chuỗi
        //kiểm tra tồn tại
        //indexOf tìm vị trí xuất hiện đầu tiên (có -vị trí / k có -1)
        document.writeln("<br>");
        document.writeln(tenSinhVien.indexOf("u"));

        //include: kiểm tra tồn tại (có - true / k có - false)
        document.writeln("<br>");
        document.writeln(tenSinhVien.includes("u"));

        //replace: thay thế
        document.writeln("<br>");
        document.writeln(tenSinhVien.replace("Tuân", "Quỳnh"));
        document.writeln(tenSinhVien);
        
        //kiểm tra chuỗi bắt đầu bằng từ gì
        document.writeln("<br>");
        document.writeln(tenSinhVien.startsWith("Nguyễn"));

        //Viết in hoa
        document.writeln("<br>");
        document.writeln(tenSinhVien.toUpperCase());

        //Viết in thường
        document.writeln("<br>");
        document.writeln(tenSinhVien.toLowerCase());
        
        //Number
        //Kiểm tra dữ liệu có phải là số hay không
        //var a = "10";
        //var so = 20;

        //var kq = isNaN();
        //document.writeln();

        //Date
        var homNay = new Date();
        document.writeln("<br>");
        document.writeln(homNay);

        //Khai báo ngày cụ thể định dạng tháng/ngày/năm
        var ngay = new Date("10/02/2026");
        document.writeln("<br>");
        document.writeln(ngay);

        //Lấy ra năm
        document.writeln("<br>");
        var nam = homNay.getFullYear();
        document.writeln(nam);

        //Lấy ra tháng
        document.writeln("<br>");
        var thang = homNay.getMonth() + 1; // getMonth() trả về giá trị từ 0-11, nên cần cộng thêm 1
        document.writeln(thang); 

        //Lấy ra ngày
        document.writeln("<br>");
        var ngay = homNay.getDate();
        document.writeln(ngay);

        //Lấy ra thứ
        document.writeln("<br>");
        var thu = homNay.getDay() + 1; // getDay() trả về giá trị từ 0-6, nên cần cộng thêm 1
        document.writeln(thu); 

        var namSinhTuan = nam - tuoi;
        document.writeln("<br>");
        document.writeln("Tuân sinh năm" + namSinhTuan);

        //MẢNG (Array)
        var mangSo = [1, 2, 3, 4, 5];
        var mangTen = ["Tuân", "Quỳnh", "Hà"];
        var thongTin = ["Tuân", 21, false]; 

        document.writeln("<br>");
        document.writeln(mangSo[2]);

        document.writeln("<br>");
        document.writeln(mangTen[1]);

        document.writeln("<br>");
        document.writeln(thongTin[0]);

        //Kiểm tra độ dài mảng length
        document.writeln("<br>");
        document.writeln(mangSo.length);
        
        //Gộp mảng Concat
        var mang = mangSo.concat(mangTen, thongTin);
        document.writeln(mang);

        //join
        document.writeln("<br>");
        document.writeln(mang.join(" - "));

        //pop lấy số cuối cùng
        document.writeln("<br>");
        document.writeln(mangSo.pop());

        //push lấy ra số cuối cùng
        document.writeln("<br>");
        mangSo.push(6);
        document.writeln(mangSo);

        //reverse
        document.writeln("<br>");
        document.writeln(mangSo.reverse());

        //var soThuNhat = 10;
        //var soThuHai = 5;
        // ==  so sánh bằng
        // !=  so sánh khác
        // >  so sánh lớn hơn
        // <  so sánh nhỏ hơn
        // >=  so sánh lớn hơn hoặc bằng
        // <=  so sánh nhỏ hơn hoặc bằng

        document.writeln("<br>");
        document.writeln(soThuNhat != soThuHai);

        //var soThuNhat = 10;
        //var soThuHai = 5;
        var c = 10;
        var d = "5.5";
        //&& || so sánh và, so sánh hoặc
        // True & True = true
        // True & False = false
        // False & False 
        document.writeln("<br>");
        document.writeln(soThuNhat > soThuHai && (c > d));

        //True || False = 
        document.writeln("<br>");
        document.writeln(soThuNhat > soThuHai || (c < d ));

        //var thu = homNay.getDay() + 1;
        document.writeln("<br>");
        if(thu == 6){
            document.writeln("Hôm nay là thứ 6");
        }
        else{
            document.writeln("Hôm nay không phải là thứ 6");
        }

        //0-> 4: F
        //4-> 5: D
        //5-> 7: C
        //7-> 8: B
        //8-> 9: A
        //9-> 10: A+
        var diem = 9;
        document.writeln("<br>");
        if(diem < 4){
            document.writeln("F");
        }
        else if(diem < 5){
            document.writeln("D");
        }
        else if(diem < 7){
            document.writeln("C");
        }
        else if(diem < 8){
            document.writeln("B");
        }
        else if(diem < 9){
            document.writeln("A");
        }
        else if(diem <= 10){
            document.writeln("A+");
        }

        //object: var name = {}
        var thongTinSinhVien = {
            hoTen: "Nguyễn Văn Tuân",
            tuoi: 21,
            gioiTinh: true, //true: nam, false: nữ
            diaChi: {
                thanhPho: "Hà Nội",
                phuong: "Tây Hồ",
                duong: "Xuân La"
            }
        }

        var thongTinPhim = {
            tenPhim: "Trại Buôn Người",
            daoDien: "Toni Dương Bảo Anh",
            dienVien: {
                    dienVienChinh: ["Steven  Nguyễn","Quách Ngọc Ngoan","Tùng Mint"],
                    dienVienPhu: ["Đinh Viết Tường","Hoàng Kim Ngọc","NSND Như Quỳnh"]
            },
            namSanXuat: 2026,
            theLoai: ["Hành động", "Tình cảm"],
            thoiLuong: 135,
        }
        document.writeln("<br>");
        document.writeln(thongTinPhim.dienVien.dienVienChinh[2]);

        //Switch case
        var d = new Date();
        var theDay = d.getDay();
        document.writeln("<br>");
        switch (theDay) {
            case 5:
                document.writeln("Finally Friday");
                break;
            case 6:
                document.writeln("Super Saturday");
                break;
            case 0:
                document.writeln("Sleepy Sunday");
                break;
            default:
                document.writeln("I'm looking forward to the Weekend");
        }

        //Vòng lặp For
        for(var index = 1; index <= 10; index++){
            document.writeln("<br>");
            document.writeln("<br>Xin chào!"+ index);
        }

        var danhSachSinhVien =["Thủy","Mai", "Tuấn", "Quỳnh", "Hà"];
        document.writeln("<br> Xin chào " + danhSachSinhVien[0]);

        for(var i =0; i < danhSachSinhVien.length; i++){
            document.writeln(i + " <br>");
            document.writeln(danhSachSinhVien[i]+ "<br>");
        }

        for(var i = 0; i < danhSachSinhVien.length; i++){
            if(danhSachSinhVien[i] == "Tuấn" || danhSachSinhVien[i] == "Thủy"){
                document.writeln("Xin chào " + danhSachSinhVien[i]);
            }
        }
           
        //popup boxes
       // alert("Xin chào các bạn!");

        //confirm
       // var r= confirm("Press a button!");
       // if(r == true){
       //     document.writeln("You pressed OK");
       // }
       // else{
       //     document.writeln("You pressed Cancel");
       // }

        //prompt
        r=prompt("Nhập vào họ tên của bạn:","Nhập tên vào đây!");
        document.writeln(r);



    </script>

    <!--external JavaScript-->
    <script src="script.js"></script>

</body>
</html>
