<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        /* margin truyền 1 ggiá trị thì sẽ cách xung quanh = giá trị đó */
        /* 2 giá trị: giá trị đầu (trên, dưới), giá trị 2 ( trái, phải) */
        /* 4 giá trị: thứ tự: trên, phải, dưới, trái */
        .Khoi-1{
            background-color:rgb(176, 245, 0);
        }
        .Khoi-2{
            background-color:red;
            margin: 100px;
        }
        /* padding truyền 1 giá trị thì sẽ padding xung quanh = giá trị đó, làm phồng xung quanh chữ */
        .Khoi-3 {
            background-color:blue;
            padding: 10px 20px 30px 40px; /*trên, phải, dưới, trái*/
        }


    </style>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
</head>
<body>
